spring.application.name=boot_junion

#Server
server.port=8282
server.servlet.session.timeout=30

#Spring MVC
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

#Database config 
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
#spring.datasource.url=jdbc:mysql://localhost:3306/atom
#spring.datasource.url=jdbc:log4jdbc:mysql://192.168.0.48:3306/junion
#spring.datasource.url=jdbc:log4jdbc:mysql://localhost:3306/junion
# 내장 MariaDB (EmbeddedMariaDbConfig). 외부 DB를 쓰려면 enabled=false 로 바꾸고 위 URL 중 하나를 사용
junion.embedded-db.enabled=true
junion.embedded-db.port=13306
junion.embedded-db.data-dir=./db-data
spring.datasource.url=jdbc:log4jdbc:mysql://127.0.0.1:13306/junion?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=junion
spring.datasource.password=1234
#spring.datasource.dbcp2.url=jdbc:mysql://localhost:3306/atom
#spring.datasource.dbcp2.username=bts
#spring.datasource.dbcp2.password=1234

#mybatis config
 mybatis.config-location=classpath:mybatis-config.xml
 
# JSON 데이터의 인코딩을 UTF-8로 설정
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true